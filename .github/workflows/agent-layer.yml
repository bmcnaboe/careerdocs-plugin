name: agent-layer

# Synced from agent-layer (module "agent-core") — edit there, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: agent-layer conformance
        run: python3 scripts/agent-layer/check.py
      - name: docs lint
        run: |
          if [ -f scripts/agent-layer/docs_lint.py ]; then
            python3 scripts/agent-layer/docs_lint.py
          else
            echo "docs-policy module not subscribed — skipped"
          fi
